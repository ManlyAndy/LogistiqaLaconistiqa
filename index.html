<!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Расчёт заказа</title>
        <link rel="stylesheet" href="style.css?v=20260727_2">
    </head>
    <body>
    <div id="stars"></div>
    <div id="moon"></div>
    <div id="cat" aria-hidden="true">

            <g id="cat-tail-group">
                <path d="M155 150 C 185 140, 190 100, 170 80" stroke="#9683ab" stroke-width="14" stroke-linecap="round" fill="none"/>
            </g>
            <ellipse cx="100" cy="150" rx="58" ry="42" fill="#c7bfd6"/>
            <ellipse cx="75" cy="188" rx="14" ry="10" fill="#c7bfd6"/>
            <path d="M60 145 Q 55 165 65 185 Q 75 190 85 185" stroke="#9683ab" stroke-width="3" fill="none" opacity="0.6"/>
            <circle cx="100" cy="88" r="50" fill="#c7bfd6"/>
            <path d="M55 75 Q 70 68 85 75" stroke="#9683ab" stroke-width="3" fill="none" opacity="0.55"/>
            <path d="M115 75 Q 130 68 145 75" stroke="#9683ab" stroke-width="3" fill="none" opacity="0.55"/>
            <path d="M60 120 Q 100 130 140 120" stroke="#9683ab" stroke-width="3" fill="none" opacity="0.4"/>
            <polygon points="58,55 70,10 95,50" fill="#c7bfd6"/>
            <polygon points="68,45 76,20 90,48" fill="#9683ab"/>
            <polygon points="142,55 130,10 105,50" fill="#c7bfd6"/>
            <polygon points="132,45 124,20 110,48" fill="#9683ab"/>
            <line x1="45" y1="95" x2="10" y2="90" stroke="#ded6e8" stroke-width="1.5"/>
            <line x1="45" y1="102" x2="10" y2="104" stroke="#ded6e8" stroke-width="1.5"/>
            <line x1="155" y1="95" x2="190" y2="90" stroke="#ded6e8" stroke-width="1.5"/>
            <line x1="155" y1="102" x2="190" y2="104" stroke="#ded6e8" stroke-width="1.5"/>
            <g id="cat-eyes">
                <ellipse id="cat-eye-l" cx="80" cy="85" rx="13" ry="15" fill="#ffffff"/>
                <ellipse id="cat-eye-r" cx="120" cy="85" rx="13" ry="15" fill="#ffffff"/>
                <circle id="cat-pupil-l" cx="80" cy="85" r="6" fill="#4a3b5c"/>
                <circle id="cat-pupil-r" cx="120" cy="85" r="6" fill="#4a3b5c"/>
            </g>
            <path d="M65 106 Q 100 132 135 106 Q 118 124 100 124 Q 82 124 65 106 Z" fill="#4a3b5c"/>

            <polygon points="95,116 101,116 98,123" fill="#ffffff"/>
            <polygon points="112,110 118,110 115,117" fill="#ffffff"/>
            <g id="cat-paw">
                <ellipse cx="128" cy="178" rx="15" ry="11" fill="#c7bfd6"/>
                <path d="M118 178 Q 128 172 138 178" stroke="#9683ab" stroke-width="2" fill="none" opacity="0.5"/>
            </g>
        </svg>
    </div>
    <div class="container">
        <h1>Logistiqa Laconistiqa</h1>
    <div class="side-panel">
        <div class="time-box">
            <div id="moscowTime">-</div>
            <div id="vladivostokTime">-</div>
        </div>
        <button id="musicToggle" class="music-btn" title="Включить/выключить музыку">
            <span class="icon">▶</span><span class="label">Музыка</span>
        </button>
        <a href="https://laconistiq.ru/" target="_blank" rel="noopener noreferrer" class="music-btn" title="Перейти на Laconistiq.ru">
            <span class="label">Laconistiq.ru</span>
            <span class="corner-icon">↗</span>
        </a>
    </div>

        <div id="items">
            <div class="item">
                <div class="autocomplete">
                    <input type="text" placeholder="какой плинтус ?">
                    <div class="list"></div>
                </div>
                <input type="number" placeholder="шт" min="1">
                <button type="button" class="removeRow" title="Удалить строку">×</button>
            </div>
        </div>

        <button id="addRow">ещё</button>
        <br><br>
        <button id="total">Итого</button>
        <button id="reset">Сброс</button>
    </div>

    <div id="resultModal" class="modal hidden">
        <div class="modal-content">
            <h3>Результат расчёта</h3>
            <div id="resultText"></div>
            <button id="close">Закрыть</button>
        </div>
    </div>
    </body>
    <script src="script.js?v=20260727_6" defer></script>
    </html>
